[project]
name = "gridpilot"
version = "0.1.0"
description = "LLM incident-response agent for a simulated power grid"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandapower>=2.14",
    "numpy>=1.26",
    "pandas>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gridpilot"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
